# Preserve the existing Compose identity and PostgreSQL volume after moving this
# file from infra/ to the repository root.
name: infra

services:
  postgres:
    image: postgres:16
    container_name: beos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: beos
      POSTGRES_PASSWORD: beos
      POSTGRES_DB: beos
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - beos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U beos -d beos"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  beos_pgdata:
