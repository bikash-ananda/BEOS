# Preserve the existing Compose identity and PostgreSQL volume after moving this
# file from infra/ to the repository root.
name: infra

services:
  postgres:
    image: postgres:16
    container_name: beos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beos}
      POSTGRES_DB: ${POSTGRES_DB:-beos}
    # No ports exposed to host! Completely private to the Docker network.
    volumes:
      - beos_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-beos} -d ${POSTGRES_DB:-beos}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: beos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-beos}:${POSTGRES_PASSWORD:-beos}@postgres:5432/${POSTGRES_DB:-beos}?schema=public
      API_PORT: 3001
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:4000}
      FILE_STORAGE_PATH: /app/uploads
      FILE_MAX_SIZE_BYTES: ${FILE_MAX_SIZE_BYTES:-10485760}
      FILE_USER_QUOTA_BYTES: ${FILE_USER_QUOTA_BYTES:-1073741824}
      FILE_TOTAL_QUOTA_BYTES: ${FILE_TOTAL_QUOTA_BYTES:-10737418240}
      AUTH_ACCESS_SECRET: ${AUTH_ACCESS_SECRET:-local-development-only-secret-change-before-production}
      AUTH_ACCESS_TTL_SECONDS: ${AUTH_ACCESS_TTL_SECONDS:-900}
      AUTH_REFRESH_TTL_DAYS: ${AUTH_REFRESH_TTL_DAYS:-30}
      AUTH_INVITE_TTL_HOURS: ${AUTH_INVITE_TTL_HOURS:-72}
      AUTH_RESET_TTL_HOURS: ${AUTH_RESET_TTL_HOURS:-2}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - beos_uploads:/app/uploads
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4001}:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:3001/api/v1/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
    container_name: beos-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      BACKEND_URL: http://api:3001
      NEXT_PUBLIC_API_ORIGIN: ${NEXT_PUBLIC_API_ORIGIN:-}
    ports:
      - "${WEB_PORT:-4000}:3000"

volumes:
  beos_pgdata:
  beos_uploads:
